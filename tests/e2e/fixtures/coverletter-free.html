<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>자유형 자기소개서 fixture</title>
  <style>.skip { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }</style>
</head>
<body>
  <!-- 잡코리아형 (docs/reports/07_site_dom_survey.md 6.2): 문항 제목을 직접 쓰는 input + 라벨 없는 내용 textarea(빈 label for) -->
  <form onsubmit="return false">
    <p><label for="nm">이름</label> <input id="nm" name="nm"></p>
    <h2>자기소개서</h2>
    <div id="introduceContainers">
      <div class="row">
        <div class="container">
          <input type="hidden" name="ResumeProfile.Index" value="c1">
          <div class="input">
            <label class="skip" for="ResumeProfile_Header_c1">제목</label>
            <input id="ResumeProfile_Header_c1" name="ResumeProfile[c1].Header" placeholder="항목 제목을 입력하세요.">
          </div>
          <label class="skip" for="">내용</label>
          <div class="textarea">
            <textarea id="ResumeProfile_Contents_c1" name="ResumeProfile[c1].Contents" placeholder="해당내용을 입력하세요."></textarea>
          </div>
        </div>
      </div>
    </div>
  </form>
</body>
</html>
