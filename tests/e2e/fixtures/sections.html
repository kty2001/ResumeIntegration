<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>섹션 문맥 fixture</title>
</head>
<body>
  <!-- 섹션 문맥 매핑 확인용: 직전 제목(h2)·fieldset legend로 섹션 판별, 반복 블록은 같은 name, enum 항목은 select -->
  <form onsubmit="return false">
    <h2>기본 정보</h2>
    <p><label for="nm">이름</label> <input id="nm" name="nm"></p>
    <p><label for="gender">성별</label> <select id="gender" name="gender"><option value="">선택하세요</option><option value="M">남자</option><option value="F">여자</option></select></p>

    <h2>학력사항</h2>
    <div>
      <p><label>학교명 <input name="school" id="school-0"></label></p>
      <p><label>전공 <input name="major" id="major-0"></label></p>
      <p><label>입학년월 <input name="edu_start" id="edu-start-0" placeholder="YYYY.MM"></label></p>
      <p><label>졸업년월 <input name="edu_end" id="edu-end-0" maxlength="6"></label></p>
      <p><label>학점 <input name="gpa" id="gpa-0"></label></p>
      <p><label>학력 구분 <select name="level" id="level-0"><option value="">선택</option><option value="HS">고등학교</option><option value="C">대학(2,3년제)</option><option value="U">대학교(4년제)</option><option value="M">대학원(석사)</option><option value="D">대학원(박사)</option></select></label></p>
      <p><label>졸업 구분 <select name="grad" id="grad-0"><option value="">선택</option><option value="1">졸업</option><option value="2">졸업예정</option><option value="3">재학</option><option value="4">휴학</option><option value="5">중퇴</option></select></label></p>
    </div>
    <div>
      <p><label>학교명 <input name="school" id="school-1"></label></p>
      <p><label>전공 <input name="major" id="major-1"></label></p>
      <p><label>입학년월 <input name="edu_start" id="edu-start-1" placeholder="YYYY.MM"></label></p>
      <p><label>졸업년월 <input name="edu_end" id="edu-end-1" maxlength="6"></label></p>
      <p><label>학점 <input name="gpa" id="gpa-1"></label></p>
      <p><label>학력 구분 <select name="level" id="level-1"><option value="">선택</option><option value="HS">고등학교</option><option value="C">대학(2,3년제)</option><option value="U">대학교(4년제)</option><option value="M">대학원(석사)</option><option value="D">대학원(박사)</option></select></label></p>
      <p><label>졸업 구분 <select name="grad" id="grad-1"><option value="">선택</option><option value="1">졸업</option><option value="2">졸업예정</option><option value="3">재학</option><option value="4">휴학</option><option value="5">중퇴</option></select></label></p>
    </div>

    <fieldset>
      <legend>경력사항</legend>
      <p><label>회사명 <input name="company" id="company"></label></p>
      <p><label>부서 <input name="dept" id="dept"></label></p>
      <p><label>고용 형태 <select name="emp" id="emp"><option value="">선택</option><option value="FT">정규직</option><option value="CT">계약직</option><option value="IN">인턴</option></select></label></p>
      <p><label>입사년월 <input name="work_start" id="work-start" placeholder="예) 2020-01"></label></p>
      <p><label>퇴사년월 <input name="work_end" id="work-end" placeholder="예) 2020-01"></label></p>
      <p><label>담당 업무 <textarea name="duty" id="duty"></textarea></label></p>
      <p><label>주소 <input name="work_addr" id="work-addr"></label></p>
    </fieldset>

    <h2>자격증</h2>
    <p><label>자격증명 <input name="cert_name" id="cert-name"></label></p>
    <p><label>발행기관 <input name="cert_issuer" id="cert-issuer"></label></p>
    <p><label>취득일 <input name="cert_date" id="cert-date" placeholder="YYYY.MM.DD"></label></p>

    <h2>어학</h2>
    <p><label>시험명 <input name="lang_exam" id="lang-exam"></label></p>
    <p><label>점수 <input name="lang_score" id="lang-score"></label></p>
    <p><label>응시일 <input name="lang_date" id="lang-date" placeholder="YYYY.MM"></label></p>

    <h2>병역사항</h2>
    <p><label>병역 구분 <select name="mil_status" id="mil-status"><option value="">선택</option><option value="1">군필</option><option value="2">미필</option><option value="3">면제</option><option value="4">비대상</option></select></label></p>
    <p><label>군별 <select name="mil_branch" id="mil-branch"><option value="">선택</option><option value="A">육군</option><option value="N">해군</option><option value="F">공군</option></select></label></p>
    <p><label>전역일 <input name="mil_end" id="mil-end" placeholder="YYYY.MM"></label></p>
  </form>
</body>
</html>
