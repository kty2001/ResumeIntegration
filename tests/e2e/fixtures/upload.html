<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>파일 업로드 fixture</title>
  <style>
    /* 커스텀 디자인: native 파일 입력란 숨김, label 버튼만 표시 */
    .custom input[type=file] { display: none; }
  </style>
</head>
<body>
  <form onsubmit="return false">
    <p><label for="cv">이력서 첨부</label> <input type="file" id="cv" accept=".pdf"> <output id="cv-name"></output></p>
    <p class="custom"><label for="pic">증명사진 올리기</label> <input type="file" id="pic" accept="image/*"></p>
    <!-- 첨부 정보는 있으나 파일 본문이 없음 → 확인 필요 -->
    <p><label for="cert">자격증 사본</label> <input type="file" id="cert"></p>
    <!-- 해당 구분 첨부 없음 → 해당 없음 -->
    <p><label for="pf">포트폴리오</label> <input type="file" id="pf"></p>
  </form>
  <script>
    const cv = document.getElementById('cv');
    cv.addEventListener('change', () => (document.getElementById('cv-name').value = cv.files[0]?.name ?? ''));
  </script>
</body>
</html>
